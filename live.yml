name: CPBL Atlas - Scheduled Live Gamecast

on:
  workflow_dispatch:
  schedule:
    # Taiwan 13:03–00:58, ~5-minute snapshots, GitHub may delay/drop scheduled jobs.
    - cron: '3-58/5 5-16 * * *'
    # Overnight / before afternoon baseball in Taiwan: ~30-minute checks.
    - cron: '11,41 0-4,17-23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cpbl-atlas-pages
  cancel-in-progress: false

jobs:
  live-scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout CPBL ATLAS
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only live sync dependencies
        run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Fetch CPBL games and validate snapshot
        run: |
          python -u scripts/sync_live.py
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('data/live/latest.json').read_text(encoding='utf-8'))
          print('OFFICIAL-SOURCE SNAPSHOT:', data['date'], len(data['games']), 'games,', data['detailFailures'], 'box-detail failures')
          for game in data['games']:
              print(game['id'], game['away'], game['awayScore'], game['homeScore'], game['home'], game['officialUrl'])
          PY
      - name: Commit only validated live data (leave previous on failure)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/
          if ! git diff --cached --quiet; then
            git commit -m 'data: verified CPBL gamecast snapshot [skip ci]'
            git push origin HEAD:main
          fi
      - name: Bundle entire existing website and live snapshots
        shell: bash
        run: |
          mkdir -p _site/assets _site/data/live _site/data/halves
          cp index.html _site/index.html
          cp assets/*.js assets/*.css _site/assets/
          if compgen -G 'data/*.json' >/dev/null; then cp data/*.json _site/data/; fi
          if compgen -G 'data/halves/*.json' >/dev/null; then cp data/halves/*.json _site/data/halves/; fi
          cp data/live/*.json _site/data/live/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy updated scoreboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
