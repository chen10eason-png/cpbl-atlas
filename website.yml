name: Build and update CPBL Atlas
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  schedule:
    # Every day at 08:15 Taiwan time (UTC+8); GitHub schedule may run late.
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cpbl-atlas-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Install optional official scraper dependencies
        run: pip install -r requirements-sync.txt
      - name: Test deterministic calculations
        run: python -m unittest discover -s tests -v
      - name: Test client-side import and basic baseball calculations
        run: |
          npm test
      - name: Refresh historical snapshots safely
        run: python scripts/sync.py
      - name: Add independently verified split-season standings when available
        shell: bash
        run: |
          python scripts/sync_halves.py --all || true
          # Missing official historical club mapping is not a reason to publish estimated values.
      - name: Sync new CPBL seasons without overwriting on failure
        id: current
        shell: bash
        run: |
          set +e
          for year in 2025 2026; do
            python scripts/sync_official.py --year "$year"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "⚠️ CPBL ${year} import failed; retaining previous snapshot" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Official source requires review: ${year}" >> /tmp/cpbl-failed-seasons
            else
              echo "✅ CPBL ${year} season validated and imported" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 0
      - name: Commit only validated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish validated CPBL snapshots'
            git push
          fi
      - name: Bundle public site
        run: |
          mkdir -p _site/assets _site/data/halves _site/data/live
          cp index.html _site/index.html
          cp assets/*.css assets/*.js _site/assets/
          cp data/*.json _site/data/
          if compgen -G "data/halves/*.json" > /dev/null; then cp data/halves/*.json _site/data/halves/; fi
          if compgen -G "data/live/*.json" > /dev/null; then cp data/live/*.json _site/data/live/; fi
          printf '' > _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unfinished official sources
        if: always()
        run: |
          if [ -f /tmp/cpbl-failed-seasons ]; then
            echo "❌ Official source validation failed; existing verified data was preserved. Check logs." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/cpbl-failed-seasons
            exit 1
          fi
