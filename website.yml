name: CPBL Atlas - Sync 2025 2026 and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'  # 08:15 Taipei, UTC+8
  push:
    branches: [main]
    paths:
      - '.github/workflows/website.yml'
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - 'requirements-sync.txt'
      - 'package.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cpbl-atlas-sync-and-pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out existing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CPBL sync dependencies
        run: python -m pip install -r requirements-sync.txt

      - name: Validate application calculations
        run: |
          python -m unittest discover -s tests -v
          npm test

      - name: Bootstrap 1990-2024 snapshots and manifest
        run: python scripts/sync.py

      - name: Import CPBL 2025 and 2026 individually
        id: official
        shell: bash
        run: |
          set +e
          missing=""
          for year in 2025 2026; do
            echo "::group::Official CPBL $year"
            python -u scripts/sync_official.py --year "$year"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "✅ $year official import returned success" >> "$GITHUB_STEP_SUMMARY"
            else
              missing="$missing $year"
              echo "❌ $year official import FAILED (exit $rc). See this step's logs." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "failed_years=${missing# }" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check published year list and basic statistical integrity
        id: coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          data = pathlib.Path('data')
          p = data / 'manifest.json'
          if not p.exists():
              raise SystemExit('ERROR: missing data/manifest.json. Historical bootstrap never completed')
          manifest = json.loads(p.read_text(encoding='utf-8'))
          missing = []
          for year in (2025, 2026):
              file = data / f'{year}.json'
              try:
                  obj = json.loads(file.read_text(encoding='utf-8'))
                  b, pit, clubs = obj['batting'], obj['pitching'], obj['teams']
                  valid = obj.get('year') == year and len(b) >= 100 and len(pit) >= 50 and len(clubs) == 6 and year in manifest['years']
                  if not valid:
                      raise ValueError(f'incomplete counts or manifest year; batters={len(b)} pitchers={len(pit)} teams={len(clubs)}')
                  print(f'PASS {year}: {len(b)} batting / {len(pit)} pitching / {len(clubs)} clubs')
              except Exception as exc:
                  missing.append(year)
                  print(f'NOT PUBLISHED {year}: {exc}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n### Published data coverage\n')
              f.write(f'- 1990–2024: {len([x for x in manifest["years"] if 1990 <= x <= 2024])} historical years in manifest\n')
              for y in (2025, 2026):
                  f.write(f'- {y}: {"verified snapshot exists" if y not in missing else "missing or invalid; NOT published"}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('missing=' + ','.join(map(str, missing)) + '\n')
          PY

      - name: Commit real, validated snapshots only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync verified CPBL year snapshots'
            git push origin HEAD:main
          fi

      - name: Package Pages site with verified data
        shell: bash
        run: |
          mkdir -p _site/assets _site/data/halves
          cp index.html _site/index.html
          cp assets/*.css assets/*.js _site/assets/
          cp data/*.json _site/data/
          if compgen -G 'data/halves/*.json' >/dev/null; then
            cp data/halves/*.json _site/data/halves/
          fi
          touch _site/.nojekyll
          echo "Published JSON files:"; find _site/data -type f -maxdepth 2 | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail visibly when the requested seasons are still unavailable
        if: always()
        shell: bash
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          FAILED_IMPORTS: ${{ steps.official.outputs.failed_years }}
          MISSING_SNAPSHOTS: ${{ steps.coverage.outputs.missing }}
        run: |
          if [ "$WORKFLOW_STATUS" != "success" ] || [ -n "$FAILED_IMPORTS" ] || [ -n "$MISSING_SNAPSHOTS" ]; then
            echo "❌ 2025/2026 not fully published. Check 'Import CPBL 2025 and 2026 individually' logs." >> "$GITHUB_STEP_SUMMARY"
            echo "Official import failures: $FAILED_IMPORTS"
            echo "Unpublished seasons: $MISSING_SNAPSHOTS"
            exit 1
          fi
          echo '✅ 2025 and 2026 verified and deployed' >> "$GITHUB_STEP_SUMMARY"
